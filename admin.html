<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallarify Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">Gallarify</div><a href="index.html">Gallery</a></header><main class="admin"><div class="panel" id="login"><h1>Admin login</h1><p class="msg">Sign in to manage memories.</p><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button id="loginBtn" class="button">Sign in</button><div id="loginMsg" class="msg"></div></div><div class="panel" id="dashboard" style="display:none"><h1>Manage memories</h1><input id="title" class="input" placeholder="Memory title"><input id="file" class="input" type="file" accept="image/*"><img id="preview" class="preview"><button id="upload" class="button">Upload memory</button><button id="logout" class="button danger">Log out</button><div id="msg" class="msg"></div><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
